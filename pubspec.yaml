name: price_query_app
description: 极简商品查询计价系统（单机版）
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 数据库
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # 网络
  http: ^1.1.0

  # 工具
  intl: ^0.18.1

  # 导出
  excel: ^4.0.6
  share_plus: ^7.2.1

  # 扫码
  mobile_scanner: ^5.2.3

  # 图片
  image_picker: ^1.1.2
  image: ^4.2.0

  # 文件选择
  file_picker: ^8.1.4

  # 待启用
  # permission_handler: ^11.3.1
  # flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

# ============ 图标生成配置 ============
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "app_icon.png"